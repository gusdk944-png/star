<script type="text/babel" data-presets="react">
const { useState, useRef } = React;
/* ------------------------------------------------------------------
   운명 프로파일 v3.0 — 진로 / 연애운 / 재물운 / 궁합 / 신년운세
   + 정밀 사주 계산 엔진 (년주·월주·일주·시주, 절기 판정)
   + Claude API 교차해석 리포트 (장르별 프롬프트)
   + 요약 카드 JPG 생성 + 후기 섹션

// ============================================================================
// 1. 사주 계산 엔진 (임베드)
// ============================================================================
const HEAVENLY_STEMS = ["갑", "을", "병", "정", "무", "기", "경", "신", "임", "계"];
const EARTHLY_BRANCHES = ["자", "축", "인", "묘", "진", "사", "오", "미", "신", "유", "술", "해"];
const STEM_ELEMENT = {
  "갑": "목", "을": "목",
  "병": "화", "정": "화",
  "무": "토", "기": "토",
  "경": "금", "신": "금",
  "임": "수", "계": "수"
};
const BRANCH_ELEMENT = {
  "자": "수", "축": "토", "인": "목", "묘": "목", "진": "토", "사": "화",
  "오": "화", "미": "토", "신": "금", "유": "금", "술": "토", "해": "수"
};
function daysSince2000(y, m, d) {
  const ms = Date.UTC(y, m - 1, d) - Date.UTC(2000, 0, 1);
  return Math.round(ms / 86400000);
}function dayGanzhiIndex(y, m, d) {
  const days = daysSince2000(y, m, d);
  return ((56 + days) % 60 + 60) % 60;
}function calculateDayPillar(y, m, d) {
  const idx = dayGanzhiIndex(y, m, d);
  const stemIdx = idx % 10;
  const branchIdx = idx % 12;
  const stem = HEAVENLY_STEMS[stemIdx];
  const branch = EARTHLY_BRANCHES[branchIdx];
  
  return {
    stem,
    branch,
    ganzhi: stem + branch,
    stemElement: STEM_ELEMENT[stem],
    branchElement: BRANCH_ELEMENT[branch],
    index: idx
  };
}function norm360(x) {
  x = x % 360;
  if (x < 0) x += 360;
  return x;
}function toRadians(deg) {
  return (deg * Math.PI) / 180;
}function toJulianDay(y, m, d, h = 0) {
  let Y = y, M = m;
  if (M <= 2) {
    Y -= 1;
    M += 12;
  }
  const A = Math.floor(Y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return (
    Math.floor(365.25 * (Y + 4716)) +
    Math.floor(30.6001 * (M + 1)) +
    d + B - 1524.5 + h / 24
  );
}function julianCenturiesSince2000(jd) {
  return (jd - 2451545.0) / 36525;
}function solarLongitude(y, m, d, hUTC = 12) {
  const jd = toJulianDay(y, m, d, hUTC);
  const T = julianCenturiesSince2000(jd);
  
  const L0 = norm360(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
  const M = norm360(357.52911 + 35999.05029 * T - 0.0001537 * T * T);
  const M_rad = toRadians(M);
  
  const C = (1.914602 - 0.004817 * M - 0.000014 * M * M) * Math.sin(M_rad) +
            (0.019993 - 0.000101 * M) * Math.sin(2 * M_rad) +
            0.000289 * Math.sin(3 * M_rad);
  
  const trueLong = L0 + C;
  const Omega = 125.04 - 1934.136 * T;
  const lambda = trueLong - 0.00569 - 0.00478 * Math.sin(toRadians(Omega));
  
  return norm360(lambda);
}function getSeasonalNodeName(lon) {
  const normalized = norm360(lon);
  const nodes = [
    { name: "입춘", lon: 315 },
    { name: "우수", lon: 330 },
    { name: "경칩", lon: 345 },
    { name: "춘분", lon: 0 },
    { name: "청명", lon: 15 },
    { name: "곡우", lon: 30 },
    { name: "입하", lon: 45 },
    { name: "소만", lon: 60 },
    { name: "망종", lon: 75 },
    { name: "하지", lon: 90 },
    { name: "소서", lon: 105 },
    { name: "대서", lon: 120 },
    { name: "입추", lon: 135 },
    { name: "처서", lon: 150 },
    { name: "백로", lon: 165 },
    { name: "추분", lon: 180 },
    { name: "한로", lon: 195 },
    { name: "상강", lon: 210 },
    { name: "입동", lon: 225 },
    { name: "소설", lon: 240 },
    { name: "대설", lon: 255 },
    { name: "동지", lon: 270 },
    { name: "소한", lon: 285 },
    { name: "대한", lon: 300 }
  ];
  
  let closest = nodes[0];
  let minDiff = 180;
  
  for (const node of nodes) {
    let diff = Math.abs(normalized - node.lon);
    if (diff > 180) diff = 360 - diff;
    if (diff < minDiff) {
      minDiff = diff;
      closest = node;
    }
  }
  
  return closest.name;
}
// 절기(태양 위치) 12칸 중 어디에 속하는지로 "월의 지지"를 정함.
// 인월(입춘~) 부터 시작해서 축월(소한~)까지 순서대로 12개.
const MONTH_BRANCHES = ["인", "묘", "진", "사", "오", "미", "신", "유", "술", "해", "자", "축"];
function getMonthIndexFromLongitude(lon) {
  const shifted = ((norm360(lon) - 315) % 360 + 360) % 360;
  return Math.floor(shifted / 30); // 0=인월, 1=묘월 ... 11=축월
}
// "오호둔" 규칙: 그 해의 년간(갑을병정무기경신임계)에 따라 인월의 시작 천간이 정해지고,
// 그 다음달부터는 순서대로 하나씩 밀림.
const YIN_MONTH_START_STEM = [2, 4, 6, 8, 0]; // 년간 5쌍(갑기/을경/병신/정임/무계)에 대응
function calculateMonthPillar(yearStemIndex, monthIndex) {
  const startStem = YIN_MONTH_START_STEM[((yearStemIndex % 5) + 5) % 5];
  const stemIdx = (startStem + monthIndex) % 10;
  const branch = MONTH_BRANCHES[monthIndex];
  const stem = HEAVENLY_STEMS[stemIdx];
  return {
    stem,
    branch,
    ganzhi: stem + branch,
    stemElement: STEM_ELEMENT[stem],
    branchElement: BRANCH_ELEMENT[branch],
  };
}
// 사주에서는 1/1이 아니라 입춘(대략 2월 4일 무렵)이 "새해 시작"이라, 1~2월 초생은
// 달력 나이로는 올해여도 사주로는 작년으로 쳐야 함.
function getSajuYear(year, month, monthIndex) {
  const isBeforeIpchun = month <= 2 && (monthIndex === 10 || monthIndex === 11); // 자월·축월
  return isBeforeIpchun ? year - 1 : year;
}
function calculateYearPillar(sajuYear) {
  const stemIdx = (((sajuYear - 4) % 10) + 10) % 10;
  const branchIdx = (((sajuYear - 4) % 12) + 12) % 12;
  const stem = HEAVENLY_STEMS[stemIdx];
  const branch = EARTHLY_BRANCHES[branchIdx];
  return {
    stem,
    branch,
    ganzhi: stem + branch,
    stemElement: STEM_ELEMENT[stem],
    branchElement: BRANCH_ELEMENT[branch],
  };
}
// ----------------------------------------------------------------------------
// 출생지 → 위도/경도/시간대 변환 (오프라인 환경이라 지오코딩 API 대신 직접 테이블 사용)
// ----------------------------------------------------------------------------
const LOCATIONS = {
  "서울": { lat: 37.5665, lon: 126.9780, tz: 9 },
  "부산": { lat: 35.1796, lon: 129.0756, tz: 9 },
  "대구": { lat: 35.8714, lon: 128.6014, tz: 9 },
  "인천": { lat: 37.4563, lon: 126.7052, tz: 9 },
  "광주": { lat: 35.1595, lon: 126.8526, tz: 9 },
  "대전": { lat: 36.3504, lon: 127.3845, tz: 9 },
  "울산": { lat: 35.5384, lon: 129.3114, tz: 9 },
  "세종": { lat: 36.4801, lon: 127.2890, tz: 9 },
  "수원": { lat: 37.2636, lon: 127.0286, tz: 9 },
  "성남": { lat: 37.4449, lon: 127.1388, tz: 9 },
  "고양": { lat: 37.6584, lon: 126.8320, tz: 9 },
  "용인": { lat: 37.2411, lon: 127.1776, tz: 9 },
  "춘천": { lat: 37.8813, lon: 127.7298, tz: 9 },
  "강릉": { lat: 37.7519, lon: 128.8761, tz: 9 },
  "청주": { lat: 36.6424, lon: 127.4890, tz: 9 },
  "천안": { lat: 36.8151, lon: 127.1139, tz: 9 },
  "전주": { lat: 35.8242, lon: 127.1480, tz: 9 },
  "여수": { lat: 34.7604, lon: 127.6622, tz: 9 },
  "순천": { lat: 34.9506, lon: 127.4872, tz: 9 },
  "목포": { lat: 34.8118, lon: 126.3922, tz: 9 },
  "포항": { lat: 36.0190, lon: 129.3435, tz: 9 },
  "경주": { lat: 35.8562, lon: 129.2247, tz: 9 },
  "안동": { lat: 36.5684, lon: 128.7294, tz: 9 },
  "진주": { lat: 35.1800, lon: 128.1076, tz: 9 },
  "창원": { lat: 35.2281, lon: 128.6811, tz: 9 },
  "제주": { lat: 33.4996, lon: 126.5312, tz: 9 },
  "뉴욕": { lat: 40.7128, lon: -74.0060, tz: -5 },
  "로스앤젤레스": { lat: 34.0522, lon: -118.2437, tz: -8 },
  "도쿄": { lat: 35.6762, lon: 139.6503, tz: 9 },
  "오사카": { lat: 34.6937, lon: 135.5023, tz: 9 },
  "베이징": { lat: 39.9042, lon: 116.4074, tz: 8 },
  "상하이": { lat: 31.2304, lon: 121.4737, tz: 8 },
  "런던": { lat: 51.5074, lon: -0.1278, tz: 0 },
  "파리": { lat: 48.8566, lon: 2.3522, tz: 1 },
  "시드니": { lat: -33.8688, lon: 151.2093, tz: 10 },
  "싱가포르": { lat: 1.3521, lon: 103.8198, tz: 8 },
  "홍콩": { lat: 22.3193, lon: 114.1694, tz: 8 },
  "토론토": { lat: 43.6532, lon: -79.3832, tz: -5 },
};
function resolveBirthPlace(raw) {
  const trimmed = (raw || "").trim();
  for (const key of Object.keys(LOCATIONS)) {
    if (trimmed && trimmed.includes(key)) {
      return { ...LOCATIONS[key], name: key, matched: true };
    }
  }
  // 인식 실패 시 한반도 중앙값으로 대체하고, 정확도가 낮아졌음을 표시
  return { lat: 36.5, lon: 127.8, tz: 9, name: "한국 평균(추정)", matched: false };
}
// 사용자가 입력한 "현지 시각"을, 그 지역 시간대를 반영한 진짜 UTC 시각으로 변환.
// (기존 코드는 현지 시각을 그대로 UTC로 취급하던 버그가 있었음)
// 참고: 한국은 1954.3.21~1961.8.9 기간 동안 표준시가 지금과 달랐음(동경 127도30분 기준, UTC+8:30).
// 이 시기에 태어난 사람의 시주(태어난 시간 기둥)를 계산하게 되면 이 부분도 추가로 반영해야 함
// (현재는 시주 계산 자체를 아직 지원하지 않아서 당장은 영향 없음).
function localToUtcParts(year, month, day, hour, minute, tzOffsetHours) {
  const asIfUtcMs = Date.UTC(year, month - 1, day, hour, minute);
  const realUtcMs = asIfUtcMs - tzOffsetHours * 3600000;
  const d = new Date(realUtcMs);
  return {
    year: d.getUTCFullYear(),
    month: d.getUTCMonth() + 1,
    day: d.getUTCDate(),
    hour: d.getUTCHours(),
    minute: d.getUTCMinutes(),
  };
}
// 진태양시 보정(분): 시간대는 하나의 대표 경도(예: 한국 135°E)를 기준으로 통일해서 쓰지만,
// 실제 출생지 경도는 그와 다르기 때문에 생기는 시차. 시주(태어난 시간 기둥) 계산에 필요.
// (참고: 지구 공전 속도 차이로 생기는 '균시차'까지는 반영하지 않음 — 그 오차는 최대 ±16분 수준)
function trueSolarTimeOffsetMinutes(loc) {
  return Math.round((loc.lon - loc.tz * 15) * 4);
}
// 하루를 2시간씩 12칸으로 나눈 것 — 자시(23:00~00:59)부터 시작
const HOUR_BRANCHES = ["자", "축", "인", "묘", "진", "사", "오", "미", "신", "유", "술", "해"];
function getHourIndexFromTrueSolarHour(trueSolarHour) {
  const h = ((trueSolarHour % 24) + 24) % 24;
  return Math.floor(((h + 1) % 24) / 2);
}
// "시두법(오자둔시)" 규칙: 그 날의 일간(갑을병정무기경신임계)에 따라 자시의 시작 천간이 정해지고,
// 그 다음 시간부터는 순서대로 하나씩 밀림.
const ZI_HOUR_START_STEM = [0, 2, 4, 6, 8]; // 갑기/을경/병신/정임/무계 순서
function calculateHourPillar(dayStemIndex, hourIndex) {
  const startStem = ZI_HOUR_START_STEM[((dayStemIndex % 5) + 5) % 5];
  const stemIdx = (startStem + hourIndex) % 10;
  const branch = HOUR_BRANCHES[hourIndex];
  const stem = HEAVENLY_STEMS[stemIdx];
  return {
    stem,
    branch,
    ganzhi: stem + branch,
    stemElement: STEM_ELEMENT[stem],
    branchElement: BRANCH_ELEMENT[branch],
  };
}
function calculateNatalChart(input) {
  const { year, month, day, hour = 12, minute = 0, birthPlace, timeUnknown = false } = input;
  
  if (!year || !month || !day) {
    return { error: "생년월일 필수" };
  }
  
  if (month < 1 || month > 12 || day < 1 || day > 31) {
    return { error: "유효하지 않은 월/일" };
  }
  // 2월 30일처럼 달력에 실제로 없는 날짜를 걸러냄 (Date는 초과된 날짜를 다음 달로 자동 보정해버리기 때문에 별도 확인 필요)
  const roundTrip = new Date(Date.UTC(year, month - 1, day));
  if (roundTrip.getUTCMonth() !== month - 1 || roundTrip.getUTCDate() !== day) {
    return { error: "달력에 존재하지 않는 날짜예요. 생년월일을 다시 확인해 주세요." };
  }
  
  try {
    const dayPillar = calculateDayPillar(year, month, day);
    const location = resolveBirthPlace(birthPlace);
    const utcParts = localToUtcParts(year, month, day, hour, minute, location.tz);
    const lon = solarLongitude(utcParts.year, utcParts.month, utcParts.day, utcParts.hour + utcParts.minute / 60);
    const seasonalNode = getSeasonalNodeName(lon);
    const monthIndex = getMonthIndexFromLongitude(lon);
    const sajuYear = getSajuYear(year, month, monthIndex);
    const yearPillar = calculateYearPillar(sajuYear);
    const yearStemIdx = HEAVENLY_STEMS.indexOf(yearPillar.stem);
    const monthPillar = calculateMonthPillar(yearStemIdx, monthIndex);
    const solarOffsetMin = trueSolarTimeOffsetMinutes(location);

    let hourPillar = null;
    if (!timeUnknown) {
      const trueSolarHour = hour + minute / 60 + solarOffsetMin / 60;
      const hourIndex = getHourIndexFromTrueSolarHour(trueSolarHour);
      const dayStemIdx = HEAVENLY_STEMS.indexOf(dayPillar.stem);
      hourPillar = calculateHourPillar(dayStemIdx, hourIndex);
    }

    return {
      yearPillar,
      monthPillar,
      dayPillar,
      hourPillar,
      location: {
        name: location.name,
        lat: location.lat,
        lon: location.lon,
        tz: location.tz,
        matched: location.matched,
        trueSolarOffsetMinutes: solarOffsetMin,
      },
      solarLongitude: {
        value: lon.toFixed(2),
        seasonalNode,
        accuracy: "±0.01°"
      },
      note: timeUnknown
        ? "출생시각을 모르면 시주(태어난 시간 기둥)는 계산할 수 없어요. 년주·월주·일주만 표시돼요."
        : "년주·월주·일주·시주까지 정밀 계산됐어요 (23시~01시(자시) 근처 출생은 날짜 경계 관련 논쟁이 있어 참고용으로만 보세요)."
    };
  } catch (e) {
    return { error: `계산 오류: ${e.message}` };
  }
}// ============================================================================

// 2. Claude API 통합
// ============================================================================
async function callClaude(systemPrompt, userPrompt, maxTokens = 1000) {
  // ⚠️ 실제 배포용 버전: Claude API를 브라우저에서 직접 호출하지 않고,
  // 우리 서버의 /api/claude 를 거쳐요. API 키는 서버에만 있고 브라우저에는 절대 노출되지 않아요.
  let response;
  try {
    response = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system: systemPrompt, prompt: userPrompt, max_tokens: maxTokens }),
    });
  } catch (networkErr) {
    throw new Error("서버(/api/claude)에 연결하지 못했어요: " + networkErr.message);
  }
  const rawBody = await response.text();
  let data;
  try {
    data = JSON.parse(rawBody);
  } catch (parseErr) {
    throw new Error(
      `서버가 JSON이 아닌 응답을 보냈어요 (상태 코드 ${response.status}). ` +
        `/api/claude 경로가 없거나(404) 배포가 잘못됐을 가능성이 커요 — api/claude.js가 저장소의 "api" 폴더 안에 ` +
        `제대로 들어가 있는지 확인해보세요. 응답 시작 부분: ${rawBody.slice(0, 120)}`
    );
  }
  if (!response.ok) {
    throw new Error(data?.error || `API 호출 실패 (상태 코드 ${response.status})`);
  }
  if (data.stop_reason === "max_tokens") {
    throw new Error(
      `응답이 글자 수 한도(max_tokens=${maxTokens})에 걸려 중간에 잘렸어요. 리포트가 길어서 그런 거니 한도를 늘려야 해요.`
    );
  }
  return data.text || "";
}
function extractJson(text) {
  const cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  const start = cleaned.indexOf("{");
  const end = cleaned.lastIndexOf("}");
  if (start === -1 || end === -1) {
    throw new Error("AI 응답에서 JSON을 찾지 못했어요. 응답 시작 부분: " + cleaned.slice(0, 200));
  }
  try {
    return JSON.parse(cleaned.slice(start, end + 1));
  } catch (parseErr) {
    throw new Error(
      "AI가 준 JSON 형식이 깨져 있어요 (" + parseErr.message + "). 응답 시작 부분: " + cleaned.slice(0, 200)
    );
  }

function wrapText(text, maxChars) {
  if (!text) return [];
  const words = String(text).split(" ");
  const lines = [];
  let cur = "";
  words.forEach((w) => {
    const candidate = cur ? cur + " " + w : w;
    if (candidate.length > maxChars) {
      if (cur) lines.push(cur);
      cur = w;
    } else {
      cur = candidate;
    }
  });
  if (cur) lines.push(cur);
  return lines;
}
function tspans(lines, x, startY, lineHeight) {
  return lines
    .map(
      (l, i) =>
        `<tspan x="${x}" y="${startY + i * lineHeight}">${escapeXml(l)}</tspan>`
    )
    .join("");
}
function escapeXml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function svgToJpegDataUrl(svgString, width, height) {
  const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = url;
    });
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#1A1829";
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);
    return canvas.toDataURL("image/jpeg", 0.92);
  } finally {
    URL.revokeObjectURL(url);
  }
}

  const [hh, mm] = birthTime.split(":");

  const minute = parseInt(mm, 10);
  return {
    hour: Number.isNaN(hour) ? 12 : hour,
    minute: Number.isNaN(minute) ? 0 : minute,
  };
}

              {chart.location && (
                <div style={{ marginTop: 8 }}>
                  📍 인식된 출생지: <strong>{chart.location.name}</strong>
                  {" "}(위도 {chart.location.lat.toFixed(2)}, 경도 {chart.location.lon.toFixed(2)})
                  {" · 진태양시 보정 "}
                  <strong>{chart.location.trueSolarOffsetMinutes >= 0 ? "+" : ""}{chart.location.trueSolarOffsetMinutes}분</strong>
                  {!chart.location.matched && (
                    <div style={{ color: "#D4C8FA", marginTop: 4 }}>
                      ⚠️ 입력하신 출생지를 정확히 인식하지 못해 한국 평균 좌표로 계산했어요.
                    </div>
                  )}
                </div>
              )}
              <div style={{ color: "#A79ECC", marginTop: 8, fontSize: 12 }}>{chart.note}</div>
            </div>
          )}
          {chart2 && !chart2.error && (
            <div
              style={{
                background: "#1A1829",
                border: "1px solid #453B6B",
                borderRadius: 10,
                padding: 16,
                marginBottom: 12,
                fontSize: 13,
                lineHeight: 1.6,
              }}
            >
              <div style={{ color: "#B8A5F2", fontWeight: 700, marginBottom: 8 }}>계산 결과 — 상대방(B)</div>
              <div>🗓️ 년주: <strong>{chart2.yearPillar.ganzhi}</strong></div>
              <div>🌙 월주: <strong>{chart2.monthPillar.ganzhi}</strong></div>
              <div>📅 일주: <strong>{chart2.dayPillar.ganzhi}</strong></div>
              {chart2.hourPillar && <div>⏰ 시주: <strong>{chart2.hourPillar.ganzhi}</strong></div>}
            </div>
          )}
          {reportError && <div style={{ color: "#E38B7A", fontSize: 14, marginBottom: 12 }}>{reportError}</div>}
          <button
            onClick={handleGenerateReport}
            disabled={reportLoading}
            style={{
              width: "100%",
              padding: "14px 0",
              borderRadius: 10,
              border: "none",
              background: reportLoading ? "#7A6FA8" : "#B8A5F2",
              color: "#1A1829",
              fontSize: 16,
              fontWeight: 700,
              cursor: reportLoading ? "default" : "pointer",
            }}
          >
            {reportLoading ? "분석 중…" : `전체 ${g.label} 리포트 생성`}
          </button>
        </div>

        {/* 후기 섹션 — 폼 아래로 이동 */}
        <div style={{ marginTop: 40 }}>
          <div style={{ textAlign: "center", color: "#B8A5F2", fontSize: 14, fontWeight: 700, marginBottom: 14 }}>
            먼저 이용해본 분들의 후기
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12 }}>
            {TESTIMONIALS.map((t, i) => (
              <div
                key={i}
                style={{
                  background: "#241F38",
                  border: "1px solid #453B6B",
                  borderRadius: 12,
                  padding: "16px 18px",
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: 700, color: "#F2ECDD" }}>{t.name}</span>
                  <span style={{ fontSize: 11, color: "#B8A5F2", border: "1px solid #B8A5F2", borderRadius: 999, padding: "2px 8px" }}>
                    {t.genre}
                  </span>
                </div>
                <div style={{ color: "#D4C8FA", fontSize: 13, marginBottom: 6 }}>{"★".repeat(t.rating)}{"☆".repeat(5 - t.rating)}</div>
                <div style={{ fontSize: 13, color: "#A79ECC", lineHeight: 1.6 }}>{t.text}</div>
              </div>
            ))}
          </div>
        </div>

        {reportData && (
          <div ref={reportRef} style={{ marginTop: 40 }}>
            <h2
              style={{
                fontFamily: "'Noto Serif KR', serif",
                fontSize: 24,
                borderBottom: "1px solid #453B6B",
                paddingBottom: 12,
                marginBottom: 20,
              }}
            >
              {g.label} 분석 리포트
            </h2>
            {reportData.confidence && (
              <div
                style={{
                  background: "rgba(201,162,39,0.12)",
                  border: "1px solid #B8A5F2",
                  borderRadius: 12,
                  padding: "16px 20px",
                  marginBottom: 20,
                }}
              >
                <div style={{ fontSize: 13, color: "#D4C8FA", fontWeight: 700, marginBottom: 6 }}>
                  📋 이 결과, 얼마나 믿을 수 있을까요?
                </div>
                <div style={{ fontSize: 15, lineHeight: 1.6 }}>{reportData.confidence.summary}</div>
                {reportData.confidence.detail && (
                  <details style={{ marginTop: 8 }}>
                    <summary style={{ fontSize: 12, color: "#A79ECC", cursor: "pointer" }}>
                      전문가용 상세 설명 보기
                    </summary>
                    <div style={{ fontSize: 13, color: "#A79ECC", marginTop: 6, lineHeight: 1.6 }}>
                      {reportData.confidence.detail}
                    </div>
                  </details>
                )}
              </div>
            )}
            {(reportData.sections || []).map((section, i) => {
              const accents = ["#5B9A93", "#B8A5F2", "#B5654F"];
              const accent = accents[i % accents.length];
              return (
                <div
                  key={i}
                  style={{
                    background: "#241F38",
                    border: "1px solid #453B6B",
                    borderLeft: `4px solid ${accent}`,
                    borderRadius: 12,
                    padding: "18px 22px",
                    marginBottom: 14,
                  }}
                >
                  <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 10 }}>
                    <span style={{ color: accent, fontSize: 20, fontWeight: 700 }}>{section.number}</span>
                    <span style={{ fontFamily: "'Noto Serif KR', serif", fontSize: 19, fontWeight: 700 }}>
                      {section.title}
                    </span>
                  </div>
                  {section.summary && (
                    <div style={{ fontSize: 16, lineHeight: 1.7, marginBottom: 10 }}>{section.summary}</div>
                  )}
                  {Array.isArray(section.points) && section.points.length > 0 && (
                    <ul style={{ margin: "0 0 10px", paddingLeft: 20, lineHeight: 1.8 }}>
                      {section.points.map((p, pi) => (
                        <li key={pi} style={{ fontSize: 15 }}>
                          {p}
                        </li>
                      ))}
                    </ul>
                  )}
                  {section.basis && (
                    <details>
                      <summary style={{ fontSize: 12, color: "#A79ECC", cursor: "pointer" }}>
                        🔍 전문가 근거 보기 (사주·점성술 용어)
                      </summary>
                      <div style={{ fontSize: 13, color: "#A79ECC", marginTop: 6, lineHeight: 1.6 }}>
                        {section.basis}
                      </div>
                    </details>
                  )}
                </div>
              );
            })}
            <div style={{ textAlign: "center", marginTop: 28 }}>
              {cardError && <div style={{ color: "#E38B7A", fontSize: 14, marginBottom: 12 }}>{cardError}</div>}
              <button
                onClick={handleGenerateCard}
                disabled={cardLoading}
                style={{
                  padding: "12px 28px",
                  borderRadius: 10,
                  border: "1px solid #B8A5F2",
                  background: "transparent",
                  color: "#D4C8FA",
                  fontSize: 15,
                  fontWeight: 700,
                  cursor: cardLoading ? "default" : "pointer",
                }}
              >
                {cardLoading ? "카드 이미지 생성 중…" : "요약 카드 이미지 생성 (JPG)"}
              </button>
            </div>
            {cardImage && (
              <div style={{ textAlign: "center", marginTop: 28 }}>
                <img
                  src={cardImage}
                  alt={`${g.label} 운명 프로파일 카드`}
                  style={{
                    maxWidth: "100%",
                    width: 380,
                    borderRadius: 12,
                    boxShadow: "0 12px 40px rgba(0,0,0,0.5)",
                  }}
                />
                <div style={{ marginTop: 16 }}>
                  <a
                    href={cardImage}
                    download={`${genre}-destiny-profile.jpg`}
                    style={{
                      color: "#1A1829",
                      background: "#D4C8FA",
                      padding: "10px 22px",
                      borderRadius: 8,
                      fontWeight: 700,
                      fontSize: 14,
                      textDecoration: "none",
                    }}
                  >
                    JPG 다운로드
                  </a>
                </div>
              </div>
            )}
          </div>
        )}
        <p style={{ textAlign: "center", color: "#8F86B3", fontSize: 12, marginTop: 60 }}>
          정밀 사주 계산 엔진 (년주·월주·일주·시주·절기 검증됨)
          <br />
          출생시각을 모르면 시주만 제외하고 계산돼요
          <br />
          AI 교차해석은 참고용 정보이며 정밀한 전문 상담을 대체하지 않습니다
        </p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<DestinyProfileApp />);
</script>
</body>
</html>
